[project]
name = "pipeline-health-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vis Sriadibhatla", email = "Vis.Sriadibhatla+prft@perficient.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
]

[project.scripts]
pipeline-health-agent = "pipeline_health_agent:main"
pha = "pipeline_health_agent.cli:main"
